<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e7a4f">
  <title>Sykkellogg</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Sykkellogg</h1>
    <nav class="tabs">
      <button id="tab-bikes" class="tab active" type="button">Sykler</button>
      <button id="tab-service" class="tab" type="button">Servicelogg</button>
    </nav>
  </header>

  <main>
    <section id="view-bikes">
      <div class="toolbar">
        <button id="btn-add-bike" class="btn primary" type="button">+ Legg til sykkel</button>
      </div>
      <div id="bike-list" class="cards"></div>
    </section>

    <section id="view-service" hidden>
      <div class="toolbar">
        <select id="filter-bike" aria-label="Filtrer på sykkel"></select>
        <button id="btn-add-entry" class="btn primary" type="button">+ Ny service</button>
      </div>
      <div id="entry-list" class="cards"></div>
    </section>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <h2 id="modal-title"></h2>
      <form id="modal-form" novalidate></form>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn" type="button">Avbryt</button>
        <button id="modal-save" class="btn primary" type="button">Lagre</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
